<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Edit User</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Edit User</h1>

      <form id="editForm">

        <label>Name</label>

        <input
          type="text"
          id="name"
          required
        >


        <label>Email</label>

        <input
          type="email"
          id="email"
          required
        >


        <label>New Password</label>

        <input
          type="password"
          id="password"
          placeholder="Leave empty to keep old password"
        >


        <label>
          Upload Images
        </label>

        <input
          type="file"
          id="images"
          accept="image/*"
          multiple
        >

        <p>Maximum 4 images</p>


        <div id="preview"></div>


        <br>


        <button type="submit">
          Update User
        </button>


        <a href="show.html">

          <button
            type="button"
          >
            Cancel
          </button>

        </a>

      </form>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
