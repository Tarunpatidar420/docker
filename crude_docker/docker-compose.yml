services:

  nodeapp:
    build: .
    restart: always

    ports:
      - "5500:5500"

    environment:
      PORT: 5500
      MONGO_URI: mongodb://tarun:tarun2805@mongo:27017/?authSource=admin

    depends_on:
      - mongo


  mongo:
    image: mongo
    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: tarun
      MONGO_INITDB_ROOT_PASSWORD: tarun2805


  mongo-express:
    image: mongo-express
    restart: always

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: tarun
      ME_CONFIG_MONGODB_ADMINPASSWORD: tarun2805
      ME_CONFIG_MONGODB_URL: mongodb://tarun:tarun2805@mongo:27017/?authSource=admin

    depends_on:
      - mongo